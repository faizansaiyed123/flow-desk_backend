name: FlowDesk demo checks

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile production modules and demo simulator
        run: python -m compileall -q app demo_app.py
      - name: Run isolated demo API tests
        run: python -m pytest -q demo_tests
